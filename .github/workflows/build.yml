name: Build GearFlow
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Debug App.jsx style block
        run: |
          python3 << 'PYEOF'
          with open('src/App.jsx', 'rb') as f:
              data = f.read()
          idx = data.find(b'<style>{')
          if idx >= 0:
              chunk = data[idx:idx+20]
              print('Style block bytes:', [hex(b) for b in chunk])
              print('Style block text:', chunk)
          else:
              print('Style block not found')
          PYEOF
      - run: npm install --legacy-peer-deps
      - run: CI=false npm run build || true
