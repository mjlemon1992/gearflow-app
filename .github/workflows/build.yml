name: Build GearFlow
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Fix App.jsx
        run: |
          python3 << 'PYEOF'
          with open('src/App.jsx', 'rb') as f:
              data = f.read()
          data = data.replace(b'\xe2\x80\x9c', b'"')
          data = data.replace(b'\xe2\x80\x9d', b'"')
          data = data.replace(b'\xe2\x80\x94', b'-')
          data = data.replace(b'\xe2\x80\x93', b'-')
          with open('src/App.jsx', 'wb') as f:
              f.write(data)
          PYEOF
      - run: npm install --legacy-peer-deps
      - run: CI=false npm run build
      - name: Inject PWA tags into index.html
        run: |
          python3 << 'PYEOF'
          with open('build/index.html', 'r') as f:
              html = f.read()
          pwa_tags = '''    <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
      <meta name="apple-mobile-web-app-title" content="GearFlow" />
      <meta name="theme-color" content="#1a2230" />
      <link rel="manifest" href="/manifest.json" />
      <link rel="apple-touch-icon" href="/gf-icon-192.png" />'''
          html = html.replace('<title>GearFlow</title>', pwa_tags + '\n    <title>GearFlow</title>')
          with open('build/index.html', 'w') as f:
              f.write(html)
          print('PWA tags injected')
          PYEOF
      - name: Commit build
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add build/ -f
          git commit -m "Add build output" || echo "Nothing to commit"
          git push
